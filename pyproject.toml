[project]
name = "streaming-cdc-pipeline-with-debezium-and-kafka"
version = "0.1.0"
description = "Streaming CDC pipeline: Postgres logical decoding via Debezium, Kafka, and an idempotent ClickHouse sink with effectively-once merges, dead-lettering, and consumer-lag monitoring."
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5",
    "clickhouse-connect>=0.8",
]

[project.optional-dependencies]
dagster = ["dagster>=1.9"]
dbt = ["dbt-clickhouse>=1.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cdc = "cdc_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdc_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
